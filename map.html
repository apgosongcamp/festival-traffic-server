<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Live Traffic Map</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 10px; }
        .timestamp { color: #888; margin-bottom: 20px; }
        
        /* Floor Toggle Container */
        .floor-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .floor-btn { background-color: #333; color: #fff; border: 2px solid #555; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .floor-btn:hover { background-color: #444; }
        .floor-btn.active { background-color: #00ffcc; color: #1a1a1a; border-color: #00ffcc; }

        /* Map Canvas */
        .map-wrapper { position: relative; width: 1000px; height: 600px; background-size: cover; background-position: center; border-radius: 15px; border: 2px solid #333; transition: background-image 0.3s ease-in-out; }
        
        /* Badges */
        .booth-badge { position: absolute; background: rgba(20, 20, 25, 0.85); backdrop-filter: blur(5px); border: 2px solid #00ffcc; border-radius: 8px; padding: 10px; width: 120px; text-align: center; transform: translate(-50%, -50%); }
        .booth-name { font-size: 12px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .booth-count { font-size: 24px; font-weight: bold; color: #00ffcc; }
        .crowded { border-color: #ff4d4d; }
        .crowded .booth-count { color: #ff4d4d; }
    </style>
</head>
<body>

    <h1>🎪 School Festival Live Traffic Map</h1>
    <div class="timestamp" id="last-updated">Updating every minute...</div>

    <div class="floor-controls">
        <button class="floor-btn active" id="btn-floor1" onclick="switchFloor(1)">1st Floor</button>
        <button class="floor-btn" id="btn-floor2" onclick="switchFloor(2)">2nd Floor</button>
    </div>

    <div class="map-wrapper" id="map-container"></div>

    <script>
        // Track which floor is currently visible
        let currentFloor = 1;

        // Maps image filenames to each floor
        const floorImages = {
            1: 'school_floorplan_1.png',
            2: 'school_floorplan_2.png'
        };

        // NEW: Booth Coordinates organized completely by Floor
        const boothDataByFloor = {
            1: {
                "Booth 1: Haunted House": { x: 250, y: 180 },
                "Booth 2: Food Court":    { x: 500, y: 450 }
            },
            2: {
                "Booth 3: Arcade Games":  { x: 780, y: 220 },
                "Booth 4: Photobooth":    { x: 150, y: 400 }
            }
        };

        function switchFloor(floorNumber) {
            currentFloor = floorNumber;
            
            // Update button visual styles
            document.getElementById('btn-floor1').classList.toggle('active', floorNumber === 1);
            document.getElementById('btn-floor2').classList.toggle('active', floorNumber === 2);
            
            // Force map calculation update
            updateMap();
        }

        function updateMap() {
            // Update background map image layout dynamically
            const container = document.getElementById('map-container');
            container.style.backgroundImage = `url('${floorImages[currentFloor]}')`;

            // Targets your active live server link
            fetch('https://festival-traffic-server.onrender.com/api/traffic')
                .then(res => res.json())
                .then(data => {
                    // Clear old booth badges off map
                    container.querySelectorAll('.booth-badge').forEach(b => b.remove());

                    // Pull coordinate mappings only for the selected active floor
                    const activeFloorCoordinates = boothDataByFloor[currentFloor];

                    for (const [boothName, count] of Object.entries(data)) {
                        const coords = activeFloorCoordinates[boothName];
                        
                        // Only draw the badge if it belongs on this floor layout grid
                        if (coords) {
                            const badge = document.createElement('div');
                            badge.className = 'booth-badge';
                            if (count >= 20) badge.classList.add('crowded');

                            badge.style.left = `${coords.x}px`;
                            badge.style.top = `${coords.y}px`;
                            badge.innerHTML = `
                                <div class="booth-name">${boothName.split(': ')[1] || boothName}</div>
                                <div class="booth-count">${count}</div>
                            `;
                            container.appendChild(badge);
                        }
                    }
                    document.getElementById('last-updated').innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
                })
                .catch(err => console.error("Error fetching traffic:", err));
        }

        // Run initial data layout load
        updateMap();
        setInterval(updateMap, 60000); // Poll server backend every 60 seconds
    </script>
</body>
</html>
